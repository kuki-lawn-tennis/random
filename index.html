<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>乱数表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
  /* レイアウト: 1カラムの操作パネル + 自動折り返しのカード格子。カードは裏返して番号を表示 */
  :root {
    --bg: #ffffff;
    --fg: #1d2b24;
    --muted: #5f6f66;
    --line: #d9e3dd;
    --accent: #1f5c3f;
    --accent-fg: #ffffff;
    --title-bg: #cdeedb;
    --title-fg: #000000;
    --back: #1f5c3f;
    --back-fg: #d9efe2;
    --front: #ffffff;
    --front-fg: #1f5c3f;
    --front-line: #1f5c3f;
    --err: #c0392b;
    --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * {
    box-sizing: border-box;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-display);
    font-size: 16px;
    line-height: 1.6;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- レイアウト ---------- */
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  h1 {
    margin: 0;
    padding: 12px 16px;
    border-radius: 8px;
    background: var(--title-bg);
    color: var(--title-fg);
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-wrap: balance;
  }

  .lead {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  /* ---------- 入力パネル ---------- */
  .panel {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .field {
    flex: 1 1 140px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  input[type="number"] {
    width: 100%;
    height: 48px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-num);
    font-size: 20px;
  }

  .btn {
    height: 48px;
    padding: 0 20px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--fg);
    font-size: 15px;
    font-weight: 700;
  }

  .btn.primary {
    flex: 1 1 120px;
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-fg);
  }

  .msg {
    flex-basis: 100%;
    margin: 0;
    min-height: 1.5em;
    color: var(--err);
    font-size: 13px;
  }

  /* ---------- 状況バー ---------- */
  .status {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .count {
    color: var(--muted);
    font-family: var(--font-num);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  .count b {
    color: var(--fg);
  }

  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tools .btn {
    height: 38px;
    padding: 0 14px;
    font-size: 13px;
  }

  /* ---------- カード ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 10px;
  }

  .card {
    width: 100%;
    aspect-ratio: 3 / 4;
    padding: 0;
    border: 0;
    background: none;
    perspective: 600px;
  }

  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s ease;
  }

  .card.open {
    cursor: default;
  }

  .card.open .inner {
    transform: rotateY(180deg);
  }

  .card:not(.open):active .inner {
    transform: scale(0.96);
  }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    font-family: var(--font-num);
    font-weight: 700;
  }

  .back {
    background: var(--back);
    color: var(--back-fg);
    font-size: 32px;
  }

  .front {
    border: 2px solid var(--front-line);
    background: var(--front);
    color: var(--front-fg);
    font-size: 38px;
    font-variant-numeric: tabular-nums;
    transform: rotateY(180deg);
  }

  @media (prefers-reduced-motion: reduce) {
    .inner {
      transition: none;
    }
  }
</style>

<div class="wrap">
  <header>
    <h1>乱数表</h1>
    <p class="lead">枚数を入力して「生成」を押してください。カードをタップすると、重複しない番号が1枚ずつ表示します。</p>
  </header>

  <form class="panel" id="form" novalidate>
    <div class="field">
      <label for="count">数字（1〜200）</label>
      <input id="count" type="number" inputmode="numeric" min="1" max="200" step="1" value="6" required>
    </div>
    <button class="btn primary" type="submit">生成</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>

  <div class="status">
    <div class="count" id="counter" aria-live="polite"></div>
    <div class="tools">
      <button class="btn" type="button" id="openAll">すべてめくる</button>
      <button class="btn" type="button" id="reshuffle">シャッフル</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
  (function () {
    var MAX = 200;
    var grid = document.getElementById('grid');
    var counter = document.getElementById('counter');
    var msg = document.getElementById('msg');
    var input = document.getElementById('count');
    var total = 0;
    var opened = 0;
    var cards = [];

    // 1〜n を重複なく並べ替える（Fisher-Yates）
    function shuffled(n) {
      var a = [];
      var i, j, t;
      for (i = 1; i <= n; i++) a.push(i);
      var buf = new Uint32Array(n);
      window.crypto.getRandomValues(buf);
      for (i = n - 1; i > 0; i--) {
        j = Math.floor((buf[i] / 4294967296) * (i + 1));
        t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }

    function updateCounter() {
      counter.innerHTML = 'めくった <b>' + opened + '</b> / ' + total;
    }

    function reveal(card) {
      if (card.classList.contains('open')) return;
      card.classList.add('open');
      card.setAttribute('aria-label', card.dataset.n + '番');
      opened++;
      updateCounter();
    }

    function build(n) {
      var frag = document.createDocumentFragment();
      cards = [];
      total = n;
      opened = 0;
      shuffled(n).forEach(function (num) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'card';
        b.dataset.n = num;
        b.setAttribute('aria-label', '伏せたカード');
        b.innerHTML =
          '<div class="inner">' +
            '<div class="face back">？</div>' +
            '<div class="face front">' + num + '</div>' +
          '</div>';
        b.addEventListener('click', function () { reveal(b); });
        frag.appendChild(b);
        cards.push(b);
      });
      grid.innerHTML = '';
      grid.appendChild(frag);
      updateCounter();
    }

    function readCount() {
      var v = Number(input.value);
      if (input.value === '' || !Number.isInteger(v) || v < 1 || v > MAX) {
        msg.textContent = '1〜' + MAX + 'の整数を入力してください。';
        return 0;
      }
      msg.textContent = '';
      return v;
    }

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var n = readCount();
      if (n) build(n);
    });

    document.getElementById('openAll').addEventListener('click', function () {
      cards.forEach(function (c) { reveal(c); });
    });

    document.getElementById('reshuffle').addEventListener('click', function () {
      if (total) build(total);
    });
  })();
</script>

</body></html>
