<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乱数表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>乱数表</h1>
    <p class="lead">枚数を入力して「生成」を押してください。カードをタップすると、番号が1枚ずつ表示します。</p>
  </header>

  <form class="panel" id="form" novalidate>
    <div class="field">
      <label for="count">数字（1〜200）</label>
      <input id="count" type="number" inputmode="numeric" min="1" max="200" step="1" value="6" required>
    </div>
    <button class="btn primary" type="submit">生成</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>

  <div class="status">
    <div class="count" id="counter" aria-live="polite"></div>
    <div class="tools">
      <button class="btn" type="button" id="openAll">すべてめくる</button>
      <button class="btn" type="button" id="reshuffle">シャッフル</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
  (function () {
    var MAX = 200;
    var grid = document.getElementById('grid');
    var counter = document.getElementById('counter');
    var msg = document.getElementById('msg');
    var input = document.getElementById('count');
    var total = 0;
    var opened = 0;
    var cards = [];

    // 1〜n を重複なく並べ替える（Fisher-Yates）
    function shuffled(n) {
      var a = [];
      var i, j, t;
      for (i = 1; i <= n; i++) a.push(i);
      var buf = new Uint32Array(n);
      window.crypto.getRandomValues(buf);
      for (i = n - 1; i > 0; i--) {
        j = Math.floor((buf[i] / 4294967296) * (i + 1));
        t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }

    function updateCounter() {
      counter.innerHTML = 'めくった <b>' + opened + '</b> / ' + total;
    }

    function reveal(card) {
      if (card.classList.contains('open')) return;
      card.classList.add('open');
      card.setAttribute('aria-label', card.dataset.n + '番');
      opened++;
      updateCounter();
    }

    function build(n) {
      var frag = document.createDocumentFragment();
      cards = [];
      total = n;
      opened = 0;
      shuffled(n).forEach(function (num) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'card';
        b.dataset.n = num;
        b.setAttribute('aria-label', '伏せたカード');
        b.innerHTML =
          '<div class="inner">' +
            '<div class="face back">？</div>' +
            '<div class="face front">' + num + '</div>' +
          '</div>';
        b.addEventListener('click', function () { reveal(b); });
        frag.appendChild(b);
        cards.push(b);
      });
      grid.innerHTML = '';
      grid.appendChild(frag);
      updateCounter();
    }

    function readCount() {
      var v = Number(input.value);
      if (input.value === '' || !Number.isInteger(v) || v < 1 || v > MAX) {
        msg.textContent = '1〜' + MAX + 'の整数を入力してください。';
        return 0;
      }
      msg.textContent = '';
      return v;
    }

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var n = readCount();
      if (n) build(n);
    });

    document.getElementById('openAll').addEventListener('click', function () {
      cards.forEach(function (c) { reveal(c); });
    });

    document.getElementById('reshuffle').addEventListener('click', function () {
      if (total) build(total);
    });
  })();
</script>
</body>
</html>
